name: update-pins

# Opens a PR when s6-overlay, Adminer or composer has a new release.
# The build workflow smoke-tests the PR; it is auto-merged when green, unless
# it bumps Adminer, which a maintainer always reviews.
on:
  schedule:
    - cron: '42 3 * * 1'  # weekly (Mon): each merged bump publishes new images
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: bump
        run: |
          echo "summary=$(scripts/update-pins.sh)" >> "$GITHUB_OUTPUT"
          if git diff --quiet -G '^ARG ADMINER_' Dockerfile; then
            echo "adminer=false" >> "$GITHUB_OUTPUT"
          else
            echo "adminer=true" >> "$GITHUB_OUTPUT"
          fi
      - id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update-pins
          commit-message: 'Bump pinned downloads: ${{ steps.bump.outputs.summary }}'
          title: 'Bump pinned downloads'
          body: ${{ steps.bump.outputs.summary }}
          # a PAT, so the PR triggers the build workflow (GITHUB_TOKEN events do not)
          token: ${{ secrets.PINS_TOKEN }}
      - if: steps.pr.outputs.pull-request-number && steps.bump.outputs.adminer == 'false'
        run: gh pr merge --auto --squash "${{ steps.pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.PINS_TOKEN }}
